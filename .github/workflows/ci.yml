name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify tokens
        run: node scripts/verify-tokens.mjs
      - name: Verify board
        run: node --experimental-strip-types scripts/verify-board.mjs
      - name: Verify README
        run: node scripts/verify-readme.mjs
