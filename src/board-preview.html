rvin-sq corvin-sq--dark" data-square="d2" data-index="11" aria-label="d2"><img class="corvin-piece" src="../../assets/pieces/corvid/w-pawn.svg" alt="White Pawn" draggable="false" width="45" height="45" /></div><div role="gridcell" id="corvin-sq-e2" class="corvin-sq corvin-sq--light corvin-sq--focus" data-square="e2" data-index="12" aria-label="e2"><img class="corvin-piece" src="../../assets/pieces/corvid/w-pawn.svg" alt="White Pawn" draggable="false" width="45" height="45" /></div><div role="gridcell" id="corvin-sq-f2" class="corvin-sq corvin-sq--dark" data-square="f2" data-index="13" aria-label="f2"><img class="corvin-piece" src="../../assets/pieces/corvid/w-pawn.svg" alt="White Pawn" draggable="false" width="45" height="45" /></div><div role="gridcell" id="corvin-sq-g2" class="corvin-sq corvin-sq--light" data-square="g2" data-index="14" aria-label="g2"><img class="corvin-piece" src="../../assets/pieces/corvid/w-pawn.svg" alt="White Pawn" draggable="false" width="45" height="45" /></div><div role="gridcell" id="corvin-sq-h2" class="corvin-sq corvin-sq--dark" data-square="h2" data-index="15" aria-label="h2"><img class="corvin-piece" src="../../assets/pieces/corvid/w-pawn.svg" alt="White Pawn" draggable="false" width="45" height="45" /></div><div role="gridcell" id="corvin-sq-a1" class="corvin-sq corvin-sq--dark" data-square="a1" data-index="0" aria-label="a1"><span class="corvin-coord corvin-coord--file corvin-coord--on-dark" data-file="a" aria-hidden="true">a</span><span class="corvin-coord corvin-coord--rank corvin-coord--on-dark" data-rank="1" aria-hidden="true">1</span><img class="corvin-piece" src="../../assets/pieces/corvid/w-rook.svg" alt="White Rook" draggable="false" width="45" height="45" /></div><div role="gridcell" id="corvin-sq-b1" class="corvin-sq corvin-sq--light" data-square="b1" data-index="1" aria-label="b1"><span class="corvin-coord corvin-coord--file corvin-coord--on-light" data-file="b" aria-hidden="true">b</span><img class="corvin-piece" src=". ="corvin-sq corvin-sq--light" data-square="h1" data-index="7" aria-label="h1"><span class="corvin-coord corvin-coord--file corvin-coord--on-light" data-file="h" aria-hidden="true">h</span><img class="corvin-piece" src="../../assets/pieces/corvid/w-rook.svg" alt="White Rook" draggable="false" width="45" height="45" /></div></div></div>
      <p class="live" id="status" aria-live="polite">Focus e2</p>
    </main>
    <script>
      const FILES = "abcdefgh"
      const RANKS = "12345678"
      const fileOf = (s) => s & 7
      const rankOf = (s) => s >> 3
      const squareToAlgebraic = (square) => FILES[fileOf(square)] + RANKS[rankOf(square)]
      const algebraicToSquare = (algebraic) => {
        const file = FILES.indexOf(algebraic[0])
        const rank = RANKS.indexOf(algebraic[1])
        return rank * 8 + file
      }
      const moveFocusSquare = (from, key, orientation) => {
        let file = fileOf(from)
        let rank = rankOf(from)
        const flip = orientation === "black"
        if (key === "ArrowRight") file += flip ? -1 : 1
        else if (key === "ArrowLeft") file += flip ? 1 : -1
        else if (key === "ArrowUp") rank += flip ? -1 : 1
        else if (key === "ArrowDown") rank += flip ? 1 : -1
        if (file < 0 || file > 7 || rank < 0 || rank > 7) return from
        return rank * 8 + file
      }

      const root = document.documentElement
      const host = document.getElementById("host")
      const status = document.getElementById("status")
      const orientation = "white"
      let focusSquare = algebraicToSquare("e2")
      let selectedSquare = null

      const boardEl = () => host.querySelector(".corvin-board")

      const syncFocusClass = () => {
        const board = boardEl()
        if (!board) return
        board.tabIndex = 0
        for (const cell of board.querySelectorAll(".corvin-sq")) {
          cell.classList.remove("corvin-sq--focus", "corvin-sq--selected")
          const idx = Number(cell.dataset.index)
          if (idx === focusSquare) cell.classList.add("corvin-sq--focus")
          if (selectedSquare !== null && idx === selectedSquare) {
            cell.classList.add("corvin-sq--selected")
          }
        }
        board.setAttribute(
          "aria-activedescendant",
          "corvin-sq-" + squareToAlgebraic(focusSquare)
        )
        status.textContent =
          "Focus " +
          squareToAlgebraic(focusSquare) +
          (selectedSquare !== null
            ? "; selected " + squareToAlgebraic(selectedSquare)
            : "")
      }

      document.getElementById("theme-light").addEventListener("click", () => {
        root.setAttribute("data-theme", "light")
      })
      document.getElementById("theme-dark").addEventListener("click", () => {
        root.setAttribute("data-theme", "dark")
      })

      host.addEventListener("keydown", (event) => {
        const board = boardEl()
        if (!board || event.target !== board) return
        const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]
        if (keys.includes(event.key)) {
          event.preventDefault()
          focusSquare = moveFocusSquare(focusSquare, event.key, orientation)
          syncFocusClass()
          return
        }
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault()
          selectedSquare =
            selectedSquare === focusSquare ? null : focusSquare
          syncFocusClass()
        }
      })

      host.addEventListener("click", (event) => {
        const cell = event.target.closest && event.target.closest("[data-index]")
        if (!cell) return
        focusSquare = Number(cell.dataset.index)
        selectedSquare = focusSquare
        syncFocusClass()
        boardEl().focus()
      })

      syncFocusClass()
    </script>
